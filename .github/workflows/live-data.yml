# 10분마다 실시간 판정 결과(JSON)를 만들어 live-data 브랜치에 올린다 → Vercel 화면이 읽는다.
# 인증키는 저장소 Settings > Secrets(SEOUL_OPEN_API_KEY, KMA_API_KEY)에만 있고, 로그에 URL을 남기지 않는다.
name: live-data
on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub 사정으로 몇 분 늦게 실행될 수 있음
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul             # 서울시·기상청 자료가 한국 시간
      SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
      KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.site.export live out/live
      - name: live-data 브랜치에 덮어쓰기 (이력 없이 최신 1개만)
        run: |
          cd out
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live
          git commit -q -m "live $(date +%Y-%m-%dT%H:%M)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-data
